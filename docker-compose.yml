version: '3.8'

services:
  airbnb-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airbnb-price-predictor
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_API_BASE=http://host.docker.internal:11434/api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
